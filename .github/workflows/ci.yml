name: JUSLUME CI
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check v3.js
          node --check cloud.js
      - name: Check required files
        run: |
          test -f index.html
          test -f schema.sql
          test -f SUPABASE_SETUP.md
